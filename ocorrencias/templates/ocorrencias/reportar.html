{% extends "ocorrencias/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Alerta Urbano - Página de reporte{% endblock title %}

{% block content %}

<h1>Faça seu Reporte</h1>

<form action="" method="POST" enctype="multipart/form-data" class="form-container">
    {% csrf_token %}
    {{ form|crispy}}
    <button type="submit" class="">Enviar</button>
</form>

{% for message in messages %}
    {{ message.message }}
{% endfor %}

{% endblock content %}
