{% extends "ocorrencias/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Alerta Urbano - Login{% endblock title %}

{% block content %}

<div class="container">

    <div class="col-lg-5 mx-auto">

        <h1 class="text-center mb-4">Faça seu Login</h1>

        <form action="" method="POST">
            {% csrf_token %}
            {{ form|crispy }}

            <button type="submit" class="btn btn-primary mt-3">
                Entrar
            </button>
        </form>

    </div>

</div>
{% endblock content %}
